server:
  port: 8080

spring:
  application:
    name: bandwidth-sharing-mvp

  # H2 内存数据库配置
  datasource:
    url: jdbc:h2:mem:bandwidthdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # H2 控制台（调试用，可访问 /h2-console 查看数据库）
  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL 初始化脚本配置
  sql:
    init:
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      mode: always

  # Thymeleaf 模板配置
  thymeleaf:
    cache: false
    encoding: UTF-8

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 下划线转驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开启 SQL 日志

logging:
  level:
    com.campus: DEBUG
